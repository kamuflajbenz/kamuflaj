<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMUFLAJ CC PACK - Color Grading Presets</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0a1122 0%, #040812 70%, #020408 100%);
      --card-bg: rgba(11, 19, 38, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 140px 16px; /* Müzik çalar için alt boşluk eklendi */
    }

    .container {
      width: 100%;
      max-width: 1240px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Yumuşatılmış Parlayan Çerçeve Efekti */
    .lux-border-wrapper {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(59, 130, 246, 0.2) 100%);
      padding: 1px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lux-border-wrapper:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(59, 130, 246, 0.35) 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px var(--accent-glow);
    }

    /* Header / Üst Alan */
    .header-panel {
      background: rgba(8, 14, 28, 0.85);
      border-radius: 23px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .header-nav-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-nav svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .header-title-box h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .about-text {
      max-width: 640px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Kartlar Grid Yapısı */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .cc-card {
      background: var(--card-bg);
      border-radius: 23px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Slider Alanı */
    .slider-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      user-select: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .slider-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .img-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .slider-divider-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 3;
    }

    .slider-handle-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 4;
      color: #040812;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .slider-range-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: ew-resize;
      z-index: 10;
    }

    /* Kart Altı */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-fullscreen {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-fullscreen:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* İndir Butonu */
    .btn-download-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 12px 20px;
      gap: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .btn-download-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.5);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Özel Önizleme Modalı (%60 Genişlik & Çerçeve) */
    .preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 4, 8, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .preview-modal.active {
      display: flex;
    }

    .modal-content-wrapper {
      width: 60vw;
      max-width: 1000px;
      min-width: 320px;
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: -45px;
      right: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* === İLERLETME ÇUBUKLU MÜZİK ÇALAR === */
    .music-player-wrapper {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 540px;
      z-index: 999;
    }

    .music-player-card {
      background: rgba(8, 14, 28, 0.95);
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(15px);
    }

    .music-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .music-player-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .music-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      flex-shrink: 0;
    }

    .music-details {
      display: flex;
      flex-direction: column;
    }

    .music-title-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .music-status-text {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .btn-play-pause {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      flex-shrink: 0;
    }

    .btn-play-pause:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    /* Süre Çubuğu ve Zamanlar */
    .music-progress-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .time-text {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 32px;
    }

    .music-progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .music-progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-blue);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
      transition: transform 0.1s ease;
    }

    .music-progress-bar::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    @media (max-width: 900px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .header-title-box h1 {
        font-size: 2.1rem;
      }
      .modal-content-wrapper {
        width: 90vw;
      }
    }
  </style>
</head>

  <script>
    let activeSlider = null;
    let originalParent = null;

    function updateSlider(element) {
      const parent = element.parentElement;
      const overlay = parent.querySelector('.img-overlay');
      const line = parent.querySelector('.slider-divider-line');
      const handle = parent.querySelector('.slider-handle-btn');
      
      const val = element.value;
      
      requestAnimationFrame(() => {
        overlay.style.clipPath = `polygon(0 0, ${val}% 0, ${val}% 100%, 0 100%)`;
        line.style.left = `${val}%`;
        handle.style.left = `${val}%`;
      });
    }

    /* Modal Açma (%60 Görünüm) */
    function openModal(sliderId) {
      activeSlider = document.getElementById(sliderId);
      originalParent = activeSlider.parentElement;
      
      const modalHolder = document.getElementById('modalHolder');
      modalHolder.appendChild(activeSlider);
      
      document.getElementById('previewModal').classList.add('active');
    }

    /* Modal Kapama */
    function closeModal() {
      if (activeSlider && originalParent) {
        originalParent.insertBefore(activeSlider, originalParent.firstChild);
        activeSlider = null;
        originalParent = null;
      }
      document.getElementById('previewModal').classList.remove('active');
    }

    /* Arka plana tıklandığında kapama */
    function closeModalOnBg(e) {
      if (e.target.id === 'previewModal') {
        closeModal();
      }
    }

    /* === MÜZİK ÇALAR KONTROLLERİ === */
    const audio = document.getElementById('siteAudio');
    const musicPlayBtn = document.getElementById('musicPlayBtn');
    const musicBtnIcon = document.getElementById('musicBtnIcon');
    const musicStatusText = document.getElementById('musicStatusText');
    const progressBar = document.getElementById('progressBar');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationText = document.getElementById('durationText');

    // MÜZİĞİN BAŞLAYACAĞI SANİYE
    const baslangicSaniyesi = 58; 

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationText.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.value = percent;
        currentTimeText.innerText = formatTime(audio.currentTime);
      }
    });

    function seekAudio(value) {
      if (audio.duration) {
        audio.currentTime = (value / 100) * audio.duration;
      }
    }

    function toggleAudio() {
      if (audio.paused) {
        if (audio.currentTime === 0 && baslangicSaniyesi > 0) {
          audio.currentTime = baslangicSaniyesi;
        }
        audio.play().then(() => {
          musicBtnIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          musicStatusText.innerText = 'Çalıyor...';
        }).catch(err => {
          console.log("Müzik oynatılamadı:", err);
        });
      } else {
        audio.pause();
        musicBtnIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        musicStatusText.innerText = 'Duraklatıldı';
      }
    }

    // MÜZİĞİ OTOMATİK BAŞLATMA FONKSİYONU
    function startMusicAuto() {
      if (!audio.paused) return; // Zaten çalıyorsa işlem yapma

      if (audio.currentTime === 0 && baslangicSaniyesi > 0) {
        audio.currentTime = baslangicSaniyesi;
      }

      audio.play().then(() => {
        musicBtnIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        musicStatusText.innerText = 'Çalıyor...';
        removeAutoPlayListeners();
      }).catch(() => {
        musicStatusText.innerText = 'Çalmak için dokunun';
      });
    }

    function removeAutoPlayListeners() {
      ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(event => {
        window.removeEventListener(event, startMusicAuto);
      });
    }

    // 1. Sayfa yüklenir yüklenmez direkt dene
    window.addEventListener('DOMContentLoaded', () => {
      startMusicAuto();
    });

    // 2. Tarayıcı engeline takılırsa en ufak kullanıcı hareketinde hemen çal
    ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(event => {
      window.addEventListener(event, startMusicAuto, { once: true });
    });
  </script>
