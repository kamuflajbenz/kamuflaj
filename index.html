<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eren - Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #01001a;
      background-image: radial-gradient(circle at center, #050042 0%, #01001e 65%, #00000e 100%);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .main-container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Üst Profil Kartı */
    .profile-card {
      background: rgba(8, 4, 52, 0.7);
      border: 1px solid rgba(40, 50, 130, 0.3);
      border-radius: 20px;
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 18px;
      border-radius: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .profile-card h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 22px;
      letter-spacing: -0.5px;
    }

    .profile-card h1 span {
      color: #00d2ff;
    }

    /* İç Bilgi Kutusu */
    .bio-box {
      background: rgba(3, 1, 28, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 20px 25px;
      font-size: 0.85rem;
      color: #b0b5d0;
      line-height: 1.6;
      max-width: 540px;
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 270px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      background: linear-gradient(135deg, #00d2ff 0%, #00a2ff 100%);
      color: #000000;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      border: none;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
    }

    /* Video Bölüm Başlığı */
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: #00d2ff;
      margin: 10px 0 5px 0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }

    /* Video Grid Alanı */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* Video ve Altındaki Buton Konteynırı */
    .video-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .video-card {
      background: rgba(8, 4, 52, 0.7);
      border: 1px solid rgba(40, 50, 130, 0.3);
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .download-btn {
      width: 100%;
      max-width: 200px;
      padding: 10px;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .media-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- Profil Kartı -->
    <div class="profile-card">
      <div class="badge">EDİTÖR</div>
      <h1>Merhaba, Ben <span>Eren</span></h1>
      
      <div class="bio-box">
        İsmim Eren 18 yaşındayım editörlükle uğraşıyorum ve valorant oyuncusuyum bu siteyi deneme ve test için açtım içeriğini değiştireceğim
      </div>

      <div class="btn-group">
        <a href="method.html" class="btn">Method</a>
        <a href="https://instagram.com/ereenjett" target="_blank" class="btn">Instagram Hesabım</a>
        <a href="https://tiktok.com/@kamuflaj.vlr" target="_blank" class="btn">Tiktok Hesabım</a>
      </div>
    </div>

    <!-- Video Başlığı -->
    <h2 class="section-title">Videolar</h2>

    <!-- 16:9 Videolar ve İndirme Butonları -->
    <div class="media-grid">
      
      <!-- Video 1 -->
      <div class="video-item">
        <div class="video-card">
          <video controls preload="metadata">
            <source src="video1.mp4" type="video/mp4">
          </video>
        </div>
        <a href="cc1.ffx" download class="btn download-btn">Dosyayı İndir</a>
      </div>

      <!-- Video 2 -->
      <div class="video-item">
        <div class="video-card">
          <video controls preload="metadata">
            <source src="video2.mp4" type="video/mp4">
          </video>
        </div>
        <a href="cc2.ffx" download class="btn download-btn">Dosyayı İndir</a>
      </div>

      <!-- Video 3 -->
      <div class="video-item">
        <div class="video-card">
          <video controls preload="metadata">
            <source src="video3.mp4" type="video/mp4">
          </video>
        </div>
        <a href="cc3.ffx" download class="btn download-btn">Dosyayı İndir</a>
      </div>

      <!-- Video 4 -->
      <div class="video-item">
        <div class="video-card">
          <video controls preload="metadata">
            <source src="video4.mp4" type="video/mp4">
          </video>
        </div>
        <a href="cc4.ffx" download class="btn download-btn">Dosyayı İndir</a>
      </div>

    </div>

  </div>

</body>
</html>
