<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eren - Portfolyo</title>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Temel Sıfırlamalar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #000080;
      background-image: radial-gradient(circle at center, #000080 0%, #000033 70%, #000010 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 40px 0;
      overflow-x: hidden;
    }

    /* Vinyet Efekti (Kenarlardan Siyah Kararma) */
    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9),
                  inset 0 0 200px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 1;
    }

    /* Konteynır */
    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 850px;
      text-align: center;
    }

    /* Üst Karşılama Kartı */
    .hero-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px;
    }

    /* Beyaz Editör Rozeti */
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      color: #ffffff;
      font-weight: 600;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .highlight {
      color: #00f2fe;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Ortalanmış Metin Kutusu */
    .template-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 20px;
      border-radius: 12px;
      margin: 0 auto 25px auto;
      max-width: 600px;
      text-align: center;
    }

    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: #e0e0e0;
    }

    /* Buton Grubu Alanı */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      max-width: 280px;
      padding: 12px 30px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #000;
      font-weight: 600;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 5px 20px rgba(0, 242, 254, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.5);
    }

    /* Özel Method Butonu Stili */
    .btn-method {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-method:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    /* 2 Sol 2 Sağ Galeri Izgarası */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* Cam Efektli 1:1 Kare Resim Kartları */
    .media-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      aspect-ratio: 1 / 1;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .media-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 242, 254, 0.4);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Resim Üzerindeki Vinyet Katmanı */
    .card-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 2;
    }

    /* Mobil Uyumluluk */
    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Vinyet Katmanı -->
  <div class="vignette"></div>

  <!-- Ana İçerik Konteynırı -->
  <main class="container">
    
    <!-- Hero (Karşılama) Alanı -->
    <section class="hero-card">
      <div class="badge">Editör</div>
      <h1 class="title">Merhaba, Ben <span class="highlight">Eren</span></h1>
      
      <!-- Tanıtım Kutusu -->
      <div class="template-box">
        <p class="description">
          İsmim Eren 18 yaşındayım editörlükle uğraşıyorum ve valorant oyuncusuyum bu siteyi deneme ve test için açtım içeriğini değiştireceğim
        </p>
      </div>

      <!-- Sosyal Medya & Sayfa Butonları -->
      <div class="btn-group">
        <!-- Method Sayfası Butonu -->
        <a href="method.html" class="btn btn-method">Method</a>

        <!-- Instagram -->
        <a href="https://instagram.com/ereenjett" target="_blank" class="btn">Instagram Hesabım</a>
        
        <!-- Tiktok -->
        <a href="https://tiktok.com/@kamuflaj.vlr" target="_blank" class="btn">Tiktok Hesabım</a>
      </div>
    </section>

    <!-- 4'lü Resim Galerisi (2 Sol - 2 Sağ) -->
    <section class="gallery-grid">
      
      <!-- Resim 1 (Sol) -->
      <div class="media-card">
        <img src="resim1.jpg" alt="Çalışma 1">
        <div class="card-vignette"></div>
      </div>

      <!-- Resim 2 (Sağ) -->
      <div class="media-card">
        <img src="resim2.jpg" alt="Çalışma 2">
        <div class="card-vignette"></div>
      </div>

      <!-- Resim 3 (Sol) -->
      <div class="media-card">
        <img src="resim3.jpg" alt="Çalışma 3">
        <div class="card-vignette"></div>
      </div>

      <!-- Resim 4 (Sağ) -->
      <div class="media-card">
        <img src="resim4.jpg" alt="Çalışma 4">
        <div class="card-vignette"></div>
      </div>

    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log("Portfolyo hazır!");
    });
  </script>
</body>
</html>
